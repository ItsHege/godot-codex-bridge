name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
      - name: Verify chat validation rejects failed child processes
        if: runner.os == 'Windows' && matrix.node-version == '24.x'
        shell: pwsh
        run: ./godot-codex-bridge/scripts/test_chat_ux_native_exit.ps1
      - name: Validate private-to-public export boundaries (workspace checkout only)
        if: runner.os == 'Windows' && matrix.node-version == '24.x'
        shell: pwsh
        run: |
          if (Test-Path tools/test_export_public.ps1) {
            & ./tools/test_export_public.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  addon-core:
    name: Godot 4.7.1 addon regression
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the pinned Godot build and verify its SHA-512
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.7.1.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'godot-4.7.1'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip' -OutFile $archive
          $expected = 'a6b02c527c18ba9936e63562032701432b2dc57d98d6483ceaccb00fe14af16af5773ae8a55e7b4d614edf121c4d9e420d870f804edb1dac16362298a01ce6c4'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          "GODOT_BIN=$runtime/Godot_v4.7.1-stable_win64_console.exe" >> $env:GITHUB_ENV
      - name: Import fixture and run addon suites
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --editor --path godot-codex-bridge/examples/minimal_3d_project --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./godot-codex-bridge/scripts/validate_addon_core.ps1 -GodotExecutable $env:GODOT_BIN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
